<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#011f14"/>
      <stop offset="100%" stop-color="#013220"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur">
        <animate attributeName="stdDeviation" values="3;9;3" dur="2.6s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- corner frame accents -->
  <g stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 26 22 L 26 48 M 26 22 L 52 22"/>
    <path d="M 1174 22 L 1174 48 M 1174 22 L 1148 22"/>
    <path d="M 26 278 L 26 252 M 26 278 L 52 278"/>
    <path d="M 1174 278 L 1174 252 M 1174 278 L 1148 278"/>
  </g>

  <!-- pill badge -->
  <rect x="440" y="34" width="320" height="32" rx="16" fill="#0a3d28" stroke="#D4AF37" stroke-width="1"/>
  <circle cx="462" cy="50" r="4" fill="#D4AF37">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="608" y="55" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#D4AF37">BUILDING WITH DATA</text>

  <!-- main glowing title -->
  <text x="600" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="60" letter-spacing="4" fill="#D4AF37" filter="url(#glow)">DAVID RAJAN S</text>

  <!-- subtitle -->
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#DDE2B1">AI &amp; DATA SCIENCE &#8226; DATA ANALYST &#8226; MACHINE LEARNING</text>

  <!-- animated underline -->
  <rect x="450" y="212" width="300" height="2" fill="#D4AF37" opacity="0.6">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- quote / tagline -->
  <text x="600" y="248" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#7FA88C">&lt;/&gt; TURNING RAW DATA INTO REAL DECISIONS</text>
</svg>
